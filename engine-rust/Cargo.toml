[package]
name = "petraterrium-engine"
version = "0.3.1"
edition = "2024"

[lib]
name = "petraterrium_engine"
path = "src/lib.rs"

[[bin]]
name = "petraterrium-engine"
path = "src/main.rs"

[dependencies]
rand = "=0.8.5"
rand_chacha = "=0.3.1"
rand_distr = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
pretty_assertions = "=1.4.1"
