[project]
name = "petraterrium"
version = "0.1.0"
description = "A deterministic, fake-data population dynamics scaffold"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28.1",
    "numpy>=2.1,<3",
    "openai>=3.37.0",
    "pyarrow>=26.0.0",
    "pycountry>=26.2.16",
    "python-multipart>=0.0.32",
    "rasterio>=1.5.2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
